<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenShellOrg</title>
    <meta
      name="description"
      content="Standards and tooling for better shells and CLIs — SOS certification and structured shell architecture."
    />
    <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b1526;
        --muted: #4a607a;
        --paper: #f3f6fa;
        --paper-deep: #e5edf6;
        --accent-red: #ff3131;
        --accent-cyan: #00d2ff;
        --mark-bg: #12233a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(0, 210, 255, 0.18), transparent 55%),
          radial-gradient(900px 500px at 90% 0%, rgba(255, 49, 49, 0.12), transparent 50%),
          linear-gradient(165deg, var(--paper) 0%, var(--paper-deep) 100%);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem 3rem;
      }

      .hero {
        width: min(44rem, 100%);
        text-align: center;
      }

      .mark {
        width: clamp(7rem, 22vw, 10rem);
        height: auto;
        margin: 0 auto 1.5rem;
        display: block;
        filter: drop-shadow(0 18px 40px rgba(11, 21, 38, 0.25));
        animation: rise 0.9s ease-out both;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        letter-spacing: -0.03em;
        line-height: 1.05;
        animation: rise 0.9s ease-out 0.08s both;
      }

      .tag {
        margin: 1rem auto 0;
        max-width: 32rem;
        font-size: 1.125rem;
        line-height: 1.5;
        color: var(--muted);
        animation: rise 0.9s ease-out 0.16s both;
      }

      .cta {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        animation: rise 0.9s ease-out 0.24s both;
      }

      .cta a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0 1.15rem;
        border-radius: 0.55rem;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .cta a:hover {
        transform: translateY(-1px);
      }

      .cta a.primary {
        background: var(--ink);
        color: #f4f7fb;
      }

      .cta a.secondary {
        background: transparent;
        color: var(--ink);
        box-shadow: inset 0 0 0 1.5px rgba(11, 21, 38, 0.22);
      }

      .note {
        margin-top: 2.5rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--muted);
        animation: rise 0.9s ease-out 0.32s both;
      }

      .note a {
        color: inherit;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <img class="mark" src="assets/logo-mark.svg" width="256" height="256" alt="OpenShellOrg" />
        <h1>OpenShellOrg</h1>
        <p class="tag">
          Standards and tooling for better shells and CLIs — SOS certification and structured
          shell architecture.
        </p>
        <div class="cta">
          <a class="primary" href="https://github.com/openshellorg">GitHub org</a>
          <a class="secondary" href="https://openshellorg.github.io/open-shell-org/">SOS docs</a>
        </div>
        <p class="note">
          Not
          <a href="https://github.com/NVIDIA/OpenShell">NVIDIA OpenShell</a>
          (agent sandbox runtime).
        </p>
      </section>
    </main>
  </body>
</html>
