<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="OpenShellOrg">
  <defs>
    <linearGradient id="bg" x1="32" y1="16" x2="224" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1526"/>
      <stop offset="1" stop-color="#12233A"/>
    </linearGradient>
    <linearGradient id="shell" x1="48" y1="56" x2="208" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FF" stop-opacity=".40"/>
      <stop offset="1" stop-color="#00D2FF" stop-opacity=".10"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <g fill="none" stroke="url(#shell)" stroke-width="10" stroke-linecap="round">
    <path d="M78 172c0-44 28-80 50-80s50 36 50 80"/>
    <path d="M58 180c0-58 38-104 70-104s70 46 70 104"/>
    <path d="M40 186c0-72 48-128 88-128s88 56 88 128"/>
  </g>

  <!-- Certification mark: white braces, white O, red S, cyan O -->
  <g font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="68" font-weight="700" text-anchor="middle">
    <text x="128" y="160">
      <tspan fill="#F4F7FB">{</tspan><tspan fill="#F4F7FB">O</tspan><tspan fill="#FF3131">S</tspan><tspan fill="#00D2FF">O</tspan><tspan fill="#F4F7FB">}</tspan>
    </text>
  </g>
</svg>
